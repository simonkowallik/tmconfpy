name: CI Pipeline  
  
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
  repository_dispatch:
    types: [start-scheduled-ci-pipeline]
# disable schedule to prevent GH to disable this workflow
#  schedule:
#    - cron: '5 5 */14 * *'

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      code-quality: write
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version:
          - '3.9' # legacy
          - '3.x' # latest
        python-package-version:
          - 'skip'  # use poetry selected version
    steps:
      - uses: actions/checkout@v6

      - name: Install poetry
        run: pipx install poetry

      - name: Configure poetry
        run: poetry config virtualenvs.in-project true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: poetry

      - name: Install dependencies
        run: poetry install --with=dev --all-extras

      - name: Install specific python package version
        if: ${{ matrix.python-package-version != 'skip' }}
        run: pip install ${{ matrix.python-package-version }}

      - name: Run tests
        run: poetry run make tests

      - name: Publish code coverage
        uses: actions/upload-code-coverage@v1
        with:
          file: coverage.xml
          language: Python
          label: code-coverage/pytest